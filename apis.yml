aid: earable
name: Earable
description: >-
  Earable Neuroscience is the maker of FRENZ Brainband, marketed as the world's
  first AI sleep-tech wearable that tracks and stimulates brain activity through
  bone-conduction speakers to promote better sleep. The company's public surface
  is the frenzband.com direct-to-consumer storefront, built on Shopify. It has no
  first-party developer API; its machine-readable surface is entirely
  Shopify-platform provided: an OIDC/OAuth2 Customer Account API advertised at
  /.well-known/openid-configuration (account.frenzband.com), a Universal Commerce
  Protocol (UCP) profile at /.well-known/ucp, published agent instructions at
  /llms.txt, and a hosted agent-commerce MCP endpoint for buyer-approved checkout.
  Added to the API Evangelist network as a 500 Global portfolio lead and enriched
  from its live public storefront surface.
